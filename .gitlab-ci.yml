# The Docker image that will be used to build your app
image: continuumio/anaconda3 #continuumio/miniconda3:latest #python:3.10-slim-bullseye
variables:
  GIT_STRATEGY: clone  
# Functions that should be executed before the build script is run

cache:
  key: venv-cache
  paths:
    - local-runner-env/
    - local-runner-env_tests/

test:
  stage: test
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-envTests" ] || [ ! -f "local-runner-envTests/bin/activate" ]; then
        echo "Creating new virtual environment..."
        python3 -m venv local-runner-envTests
      fi
      echo "Activating virtual environment..."
      source local-runner-envTests/bin/activate
      #if ! python -c "import FELiCS" 2>/dev/null; then
      #  echo "Installing FELiCS environment and dependecies..."
      #  pip install -U pip
      #  pip install -U pytest
      #  --- insert FELiCS packages & pytest
  script:
    - cd TESTS
    #- python3 -m pytest 
  only:
    - development
    #- main

pages:
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-env3" ] || [ ! -f "local-runner-env3/bin/activate" ]; then
        echo "\nCreating new virtual environment...\n"	
        python3 -m venv local-runner-env3
      fi
      echo "Activating virtual environment..."	
      source local-runner-env3/bin/activate
      
      if ! python -c "import sphinx" 2>/dev/null; then
        echo "installing sphinx and dependencies..."	
        pip install -U pip
        pip install -U sphinx myst-parser sphinx-book-theme
        pip install -U sphinx-autoapi==3.0.0
        pip install sphinxcontrib-mermaid
      fi

  script:
  - cd DOCUMENTATION
  - mkdir ../public
  - python3 --version
  - pip list
  #- make html
  - sphinx-build -b html . _build
  - ls
  - cp -r _build/ ../public/.
  - cd ..
  - ls
  - cp -r public/_build/* public/
  - rm -r public/_build

  artifacts:
    paths:
      - public
  only:
    - development
    #- main