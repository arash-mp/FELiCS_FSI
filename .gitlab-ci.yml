# The Docker image that will be used to build your app
image: continuumio/miniconda3:latest #python:3.10-slim-bullseye
variables:
  GIT_STRATEGY: clone  
# Functions that should be executed before the build script is run

cache:
  key: venv-cache
  paths:
    - .local-runner-env/
    - .local-runner-env_tests/

test:
  stage: test
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-env-tests" ] || [ ! -f "local-runner-env-tests/bin/activate" ]; then
        echo "\nCreating new virtual environment...\n"	
        python3 -m venv local-runner-env-tests
      fi
      echo "Activating virtual environment..."	
    - echo "one up"
    - ls -all ../
    - echo "two up"
    - ls -all ../../
    - echo "three up"
    - ls -all ../../../
    - echo "four up"
    - ls -all ../../../../
    - echo "five up"
    - ls -all ../../../../../
    - cat ../../../../../bashrc
    - source local-runner-env-tests/bin/activate    
      #export PATH="$PATH:/opt/anaconda3/bin"
      #- conda init
      #- conda env create -f INSTALLATION/felics_v2.4_env.yml
      #- conda activate felics2025_dolfin9
      #conda install pytest
    - pip install -U pip
    - pip install -U pytest
  script:
    - cd TESTS
    - python3 -m pytest 
  only:
    - development
    #- main

pages:
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-env" ] || [ ! -f "local-runner-env/bin/activate" ]; then
        echo "\nCreating new virtual environment...\n"	
        python3 -m venv local-runner-env
      fi
      echo "Activating virtual environment..."	
      source local-runner-env/bin/activate
      
      if ! python -c "import sphinx" 2>/dev/null; then
        echo "installing sphinx and dependencies..."	
        pip install -U pip
        pip install -U sphinx myst-parser sphinx-book-theme sphinx-autoapi
      fi

  script:
  - cd DOCUMENTATION
  - mkdir ../public
  - python3 --version
  - pip list
  #- make html
  - sphinx-build -b html . _build
  - ls
  - cp -r _build/ ../public/.
  - cd ..
  - ls
  - cp -r public/_build/* public/
  - rm -r public/_build

  artifacts:
    paths:
      - public
  only:
    - development
    #- main
