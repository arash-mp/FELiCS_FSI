# Base image for building docs/tests
image: continuumio/anaconda3

variables:
  GIT_STRATEGY: clone

stages:
  - test
  - build
  - deploy

cache:
  key: venv-cache
  paths:
    - local-runner-env/
    - local-runner-env_tests/

# ---------------------------
# Tests (runs on development)
# ---------------------------
test:
  stage: test
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-env-tests" ] || [ ! -f "local-runner-env-tests/bin/activate" ]; then
        echo "Creating new virtual environment..."
        python3 -m venv local-runner-env-tests
      fi
      echo "Activating virtual environment..."
      source local-runner-env-tests/bin/activate
    - pip install -U pip
    - pip install -U pytest
  script:
    - cd TESTS
    # - python3 -m pytest
  only:
    - development

# ---------------------------
# Build docs (for development and tags)
# ---------------------------
build_docs:
  stage: build
  before_script:
    - git --version
    - ls -all
    - |
      if [ ! -d "local-runner-env3" ] || [ ! -f "local-runner-env3/bin/activate" ]; then
        echo "Creating new virtual environment..."
        python3 -m venv local-runner-env3
      fi
      echo "Activating virtual environment..."
      source local-runner-env3/bin/activate
      if ! python -c "import sphinx" 2>/dev/null; then
        echo "Installing Sphinx and dependencies..."
        pip install -U pip
        pip install -U sphinx myst-parser sphinx-book-theme
        pip install -U sphinx-autoapi==3.0.0
        pip install -U sphinxcontrib-mermaid
      fi
  script:
    - cd DOCUMENTATION
    - mkdir -p _static                 # ensure exists
    # --- create versions.json BEFORE building ---
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo '[{"version":"'"$CI_COMMIT_TAG"'","url":"/'"$CI_COMMIT_TAG"'/"},
               {"version":"latest","url":"/"}]' > _static/versions.json
        echo "Created _static/versions.json for tag: $CI_COMMIT_TAG"
      else
        echo '[{"version":"latest","url":"/"}]' > _static/versions.json
        echo "Created _static/versions.json for latest only"
      fi
      echo "versions.json content:" && cat _static/versions.json
    # --- now build ---
    - mkdir -p ../public
    - sphinx-build -b html . _build
    - cp -r _build/ ../public/.
    - cd ..
    - cp -r public/_build/* public/
    - rm -r public/_build
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG'
  pages:
    path_prefix: "$CI_COMMIT_BRANCH"
    expire_in: never


# ---------------------------
# Deploy "latest" (root, no prefix) — development only
# ---------------------------
pages:
  stage: deploy
  needs: ["build_docs"]
  script:
    - echo "Publishing latest docs to ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

# ---------------------------
# Deploy versioned releases under /$CI_COMMIT_TAG/ (parallel deployments)
# ---------------------------
pages:versioned:
  stage: deploy
  needs: ["build_docs"]
  script:
    - echo "Publishing versioned docs for tag ${CI_COMMIT_TAG} to ${CI_PAGES_URL}/${CI_COMMIT_TAG}/"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_TAG'
  pages:
    path_prefix: "$CI_COMMIT_TAG"
    expire_in: never
