# The Docker image that will be used to build your app
image: python:3.10-slim-bullseye
variables:
  GIT_STRATEGY: clone  
# Functions that should be executed before the build script is run
before_script:
  - git --version
  - python3 -m venv local-runner-env
  - source local-runner-env/bin/activate
  - pip3 install -U sphinx
  - pip3 install -U myst-parser
  - pip3 install -U sphinx-book-theme
  - pip3 install -U sphinx-autoapi

pages:
  script:
  - cd DOCUMENTATION
  - mkdir ../public
  - python3 --version
  - pip list
  #- make html
  - sphinx-build -b html . _build
  - ls
  - cp -r _build/ ../public/.
  - cd ..
  - ls
  - cp -r public/_build public/
  - rm -r public/_build

  artifacts:
    paths:
      - public
  only:
    - development
    #- main
